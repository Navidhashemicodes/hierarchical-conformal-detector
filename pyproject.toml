[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-conformal-detector"
version = "0.1.0"
description = "Trajectory-level hierarchical conformal anomaly detection toolbox"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.22,<2", "scipy>=1.8,<2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
benchmarks = ["gdown>=5.2,<6", "matplotlib>=3.5,<4", "nbformat>=5.7,<6"]

[tool.setuptools.packages.find]
include = ["hierarchical_conformal*"]

